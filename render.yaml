services:
  - type: web
    name: bloodbank
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_MODE
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URL
        sync: false
